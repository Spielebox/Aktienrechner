*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}

 return`<div class="c"><h2 style="margin-top:0">Verkauf simulieren</h2>${sfm()}${eb("sim","addSi()","Simulation speichern")}<div id="m" class="n"></div><p class="mu">Simulationen beeinflussen deine echten Zahlen nicht. Jede wird einzeln gegen deinen aktuellen Stand gerechnet.</p></div>`
 +(S.sim.length?S.sim.map(x=>{const r=simr(x);return`<div class="c"><b>${esc(x.stock)}</b> <span class="mu">${D(x.date)}, ${nf(x.qty)} Stk. zu ${f(x.price)}</span>${r.over?`<div class="n">Mehr als im Bestand.</div>`:""}${stats(r)}<button onclick="adopt('${x.id}')">Als Verkauf übernehmen</button> <button class="s" onclick="edit('sim','${x.id}')">Bearbeiten</button> <button class="s" onclick="del('sim','${x.id}',this)">Löschen</button></div>`}).join(""):`<div class="c mu">Noch keine Simulation gespeichert.</div>`)}
function addSi(){const x=rd();if(!ok(x))return msg("Bitte Aktie, Datum, Stückzahl und Kurs ausfüllen.");put("sim",x);ed=null;save();R()}
function adopt(id){const x=S.sim.find(s=>s.id==id);S.sells.push({...x,tx:null});if(C().res.find(r=>r.id==id).over){S.sells.pop();return msg("Mehr Stück als im Bestand.")}S.sim=S.sim.filter(s=>s.id!=id);save();R()}

function vBy(){const n=[...new Set(S.buys.map(b=>b.stock))].sort();
 return `<div class="c"><h2 style="margin-top:0">Kauf erfassen</h2><label>Aktie</label><select id="bn" onchange="$('#bnn').style.display=this.value=='__n'?'':'none'">${n.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join("")}<option value="__n">Neue Aktie …</option></select><input id="bnn" placeholder="Name der Aktie" style="display:${n.length?"none":""}"><label>Kaufdatum</label><input id="bd" type="date" value="${today()}"><label>Stück</label><input id="bq" inputmode="decimal"><label>Eingabe</label><select id="bm" onchange="$('#bk').style.display=this.value=='k'?'':'none';$('#bg').style.display=this.value=='t'?'':'none'"><option value="k">Kurs und Gebühr getrennt</option><option value="t">Gesamtkosten inkl. Gebühren</option></select><div id="bk" class="g"><div><label>Kurs (€)</label><input id="bp" inputmode="decimal"></div><div><label>Gebühr (€)</label><input id="bf" inputmode="decimal"></div></div><div id="bg" style="display:none"><label>Gesamtkosten (€)</label><input id="bt" inputmode="decimal"></div>${eb("buys","addBy()","Kauf speichern")}<div id="m" class="n"></div></div>`
 +(S.buys.length?[...S.buys].sort((a,b)=>b.date.localeCompare(a.date)).map(b=>`<div class="c"><b>${esc(b.stock)}</b> <span class="mu">${D(b.date)}, ${nf(b.qty)} Stk.</span>${kv([["Gesamtkosten",f(b.total)],["Pro Stück inkl. Gebühr",f(b.total/b.qty)]])}<button class="s" onclick="edit('buys','${b.id}')">Bearbeiten</button> <button class="s" onclick="del('buys','${b.id}',this)">Löschen</button></div>`).join(""):`<div class="c mu">Noch kein Kauf erfasst.</div>`)}
function addBy(){const q=num(v("bq")),t=v("bm")=="t"?num(v("bt")):q*num(v("bp"))+(num(v("bf"))||0),x={id:uid(),stock:v("bn")=="__n"?v("bnn").trim():v("bn"),date:v("bd"),qty:q,total:t};
 if(!x.stock||!x.date||!(q>0)||!(t>=0))return msg("Bitte Aktie, Datum, Stückzahl und Kosten ausfüllen.");
 const old=S.buys.slice();put("buys",x);
 if(C().res.some(r=>r.over)){S.buys=old;return msg("Mit dieser Änderung wäre später mehr verkauft, als im Bestand ist.")}
 ed=null;save();R()}

function vSt(){const{res}=C(),ys=[...new Set(res.map(r=>r.date.slice(0,4)).concat(today().slice(0,4)))].sort();
 return `<div class="c"><h2 style="margin-top:0">Steuer</h2><label>Kirchensteuer (%, 0 = keine)</label><div class="mu" style="margin-bottom:4px">Hinweis: 8 % in Bayern und Baden-Württemberg, 9 % in allen anderen Bundesländern.</div><input inputmode="decimal" value="${nf(S.set.church)}" onchange="S.set.church=num(this.value)||0;save();R()"><label>Verlustvortrag zum Start (€)</label><input inputmode="decimal" value="${nf(S.set.carry)}" onchange="S.set.carry=num(this.value)||0;save();R()"><div class="k" style="margin:6px 0">Freibetrag je Jahr (€), dem Depot zugeteilt</div><div class="g">${ys.map(y=>`<div><label>${y}</label><input inputmode="decimal" value="${nf(S.set.al[y]!=null?S.set.al[y]:1000)}" onchange="S.set.al['${y}']=num(this.value)||0;save();R()"></div>`).join("")}</div><p class="mu">Satz: 25 % plus 5,5 % Soli, bei Kirchensteuer entsprechend angepasst. Verluste werden nur mit Gewinnen verrechnet. Der Freibetrag ist der Betrag, den du diesem Depot zugeteilt hast (z. B. per Freistellungsauftrag). Erfasste Dividenden werden automatisch davon abgezogen.</p></div>
 <div class="c"><h2 style="margin-top:0">Aktie umbenennen</h2><select id="rn0">${allNames().map(n=>`<option>${esc(n)}</option>`).join("")}</select><input id="rn1" placeholder="Neuer Name"><button onclick="rnm()">Umbenennen</button></div>
 <div class="c"><h2 style="margin-top:0">Sicherheit</h2><label>Neuer Code (mindestens 6 Zeichen)</label><input id="nc" type="password"><button onclick="chg()">Code ändern</button> <button class="s" onclick="lock()">Jetzt sperren</button><div id="m" class="n"></div></div>
 <div class="c"><h2 style="margin-top:0">Export und Import</h2><button onclick="ex()">Verschlüsselten Export erzeugen</button><textarea id="ex" rows="4" readonly placeholder="Text kopieren und sicher aufbewahren"></textarea><label>Export einfügen</label><textarea id="im" rows="3"></textarea><label>Code des Exports</label><input id="ic" type="password"><button onclick="imp()">Importieren</button><div id="m2" class="n"></div><p class="mu">Ein Import ersetzt alle aktuellen Daten.</p></div>
 <div class="c"><button class="s" onclick="rs2(this)">Alle Daten löschen</button></div>`}
async function chg(){const p=v("nc");if(p.length<6)return msg("Mindestens 6 Zeichen.");salt=crypto.getRandomValues(new Uint8Array(16));key=await derive(p,salt);await save();$("#nc").value="";msg("Code geändert.")}
async function ex(){$("#ex").value=await seal(key,salt,S)}
async function imp(){try{const b=v("im").trim(),o=JSON.parse(b),k=await derive(v("ic"),ub(o.s));S=await open(k,b);S.sim=S.sim||[];S.div=S.div||[];await save();tab="ov";R()}catch(e){$("#m2").textContent="Import fehlgeschlagen: Text oder Code stimmt nicht."}}
function rs2(b){if(!b.dataset.c){b.dataset.c=1;b.textContent="Wirklich alles löschen?";return}try{localStorage.removeItem(K)}catch(e){}S=null;key=null;R()}
R();
</script></body></html>

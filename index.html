<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gewinnbuch</title>
<style>
:root{--bg:#eceff0;--card:#fbfcfc;--tx:#14232b;--mu:#5d6c73;--ln:#d3dbde;--ac:#0f5c63;--bt:#fff;--ok:#1d7a46;--bad:#b3261e;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a1f;--card:#17262c;--tx:#e4ecee;--mu:#8ea1a8;--ln:#2a3d45;--ac:#5cc2c9;--bt:#07272a;--ok:#58c987;--bad:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1a1f;--card:#17262c;--tx:#e4ecee;--mu:#8ea1a8;--ln:#2a3d45;--ac:#5cc2c9;--bt:#07272a;--ok:#58c987;--bad:#ff8a80;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:720px;margin:0 auto;padding:14px}
h1,h2{font-family:Georgia,"Iowan Old Style",serif;font-weight:600}
h1{font-size:24px;margin:6px 0 12px}h2{font-size:17px;margin:20px 0 8px}
.c{background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:12px;margin:8px 0}
.mu,.k{color:var(--mu);font-size:13px}
.v{font-family:Georgia,serif;font-size:17px;font-variant-numeric:tabular-nums}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
button,input,select,textarea{font:inherit;color:var(--tx)}
button{background:var(--ac);color:var(--bt);border:0;border-radius:8px;padding:10px 14px;margin-top:4px}
button.s,.tabs button{background:var(--card);color:var(--tx);border:1px solid var(--ln)}
.tabs button{padding:8px 12px;white-space:nowrap;margin:0}
.tabs button.on{background:var(--ac);color:var(--bt);border-color:var(--ac)}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:10px;margin:3px 0 8px}
label{font-size:13px;color:var(--mu)}
input[type="date"]{display:block;min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;min-height:44px;text-align:left}
.g>div{min-width:0}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px}
.p{color:var(--ok)}.n{color:var(--bad)}
.w{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:6px 4px;text-align:right;border-bottom:1px solid var(--ln);white-space:nowrap}
th{color:var(--mu);font-weight:400}th:first-child,td:first-child{text-align:left}
a{color:var(--ac)}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),K="aktien_v1",v=i=>$("#"+i).value;
const VER="1.3",VF=`<p class="mu" style="text-align:center;margin-top:18px">Gewinnbuch · Version ${VER}</p>`;
let S=null,key=null,salt=null,tab="ov",timer,hid=0;
const te=new TextEncoder(),td=new TextDecoder();
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))),ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const ld=()=>{try{return localStorage.getItem(K)}catch(e){return null}};
async function derive(p,s){const m=await crypto.subtle.importKey("raw",te.encode(p),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt:s,iterations:300000,hash:"SHA-256"},m,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function seal(k,s,o){const iv=crypto.getRandomValues(new Uint8Array(12));const c=await crypto.subtle.encrypt({name:"AES-GCM",iv},k,te.encode(JSON.stringify(o)));return JSON.stringify({v:1,s:b64(s),i:b64(iv),d:b64(c)})}
async function open(k,blob){const o=JSON.parse(blob);return JSON.parse(td.decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:ub(o.i)},k,ub(o.d))))}
async function save(){try{localStorage.setItem(K,await seal(key,salt,S))}catch(e){msg("Speichern nicht möglich.")}}
function msg(t){const m=$("#m");if(m)m.textContent=t}
function lock(){S=null;key=null;R()}
function touch(){clearTimeout(timer);timer=setTimeout(lock,300000)}
["click","keydown","touchstart"].forEach(e=>addEventListener(e,()=>{if(S)touch()},{passive:true}));
document.addEventListener("visibilitychange",()=>{if(document.hidden)hid=Date.now();else if(S&&Date.now()-hid>60000)lock()});

const num=x=>parseFloat(String(x).replace(",",".")),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const f=n=>(Math.abs(n)<.005?0:n).toLocaleString("de-DE",{style:"currency",currency:"EUR"});
const nf=n=>String(n).replace(".",","),D=d=>d.split("-").reverse().join("."),cl=n=>n>=0?"p":"n";
const today=()=>new Date().toISOString().slice(0,10),days=(a,b)=>Math.round((Date.parse(b)-Date.parse(a))/864e5);
const H=d=>d<100?Math.round(d)+" Tage":d<730?Math.round(d/30.44)+" Mon.":(d/365.25).toFixed(1).replace(".",",")+" Jahre";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sm=(a,k)=>a.reduce((x,r)=>x+r[k],0);

function C(){
 const ev=[...S.buys.map(b=>({...b,t:"b"})),...S.sells.map(s=>({...s,t:"s"}))].sort((a,b)=>a.date.localeCompare(b.date)||(a.t==b.t?0:a.t=="b"?-1:1));
 const lots={},res=[];
 for(const e of ev){const L=lots[e.stock]=lots[e.stock]||[];
  if(e.t=="b"){L.push({d:e.date,q:e.qty,c:e.total/e.qty});continue}
  let need=e.qty,cost=0,dd=0;
  while(need>1e-9&&L.length){const l=L[0],q=Math.min(l.q,need);cost+=q*l.c;dd+=q*days(l.d,e.date);l.q-=q;need-=q;if(l.q<=1e-9)L.shift()}
  const gross=e.qty*e.price-cost;
  res.push({...e,cost,gross,net0:gross-e.fee,hold:dd/e.qty,over:need>1e-9})}
 const k=(+S.set.church||0)/100,rate=.25/(1+.25*k)*(1.055+k);
 let carry=+S.set.carry||0;const Y={};
 for(const y of [...new Set(res.map(r=>r.date.slice(0,4)))].sort()){
  const al=S.set.al[y]!=null?+S.set.al[y]:1000;let run=-carry,pt=0;
  for(const r of res.filter(r=>r.date.slice(0,4)==y)){run+=r.net0;const cu=Math.max(0,run-al)*rate;r.tc=cu-pt;pt=cu}
  Y[y]={al,used:Math.min(al,Math.max(0,run)),carry:Math.max(0,-run)};carry=Math.max(0,-run)}
 for(const r of res){r.tax=r.tx!=null?r.tx:r.tc;r.after=r.net0-r.tax}
 return{res,lots,Y}}

function lockHTML(){const h=ld(),K2='onkeydown="if(event.keyCode==13)go()"';
 return `<h1>Gewinnbuch</h1><div class="c"><label>${h?"Code eingeben":"Code festlegen (mindestens 6 Zeichen)"}</label><input id="pw" type="password" autocomplete="off" ${K2}>${h?"":`<label>Code wiederholen</label><input id="pw2" type="password" ${K2}>`}<button onclick="go()">${h?"Entsperren":"Code festlegen"}</button><div id="m" class="n"></div><p class="mu">Die Daten liegen verschlüsselt nur auf diesem Gerät. Ohne den Code ist keine Wiederherstellung möglich – sichere deshalb regelmäßig einen Export.</p></div>${h?`<p class="mu"><a href="#" onclick="return rs(this)">Alle Daten zurücksetzen</a></p>`:""}`}
function rs(a){if(!a.dataset.c){a.dataset.c=1;a.textContent="Wirklich alles löschen? Nochmal tippen.";return false}try{localStorage.removeItem(K)}catch(e){}S=null;key=null;R();return false}
async function go(){const h=ld(),p=v("pw");
 try{
  if(!h){if(p.length<6)return msg("Der Code braucht mindestens 6 Zeichen.");if(p!==v("pw2"))return msg("Die Codes stimmen nicht überein.");
   salt=crypto.getRandomValues(new Uint8Array(16));key=await derive(p,salt);S={buys:[],sells:[],sim:[],set:{church:0,al:{},carry:0}};await save()}
  else{const o=JSON.parse(h);salt=ub(o.s);const k=await derive(p,salt);try{S=await open(k,h);S.sim=S.sim||[];key=k}catch(e){return msg("Falscher Code.")}}
 }catch(e){return msg("Verschlüsselung nicht verfügbar. Öffne die Seite über https.")}
 tab="ov";touch();R()}

function R(){const a=$("#app");if(!S){a.innerHTML=lockHTML()+VF;return}
 a.innerHTML=`<h1>Gewinnbuch</h1><div class="tabs">${[["ov","Übersicht"],["by","Kauf"],["sl","Verkauf"],["vl","Verlauf"],["yr","Jahre"],["si","Simulation"],["st","Einstellungen"]].map(([k,t])=>`<button class="${tab==k?"on":""}" onclick="tab='${k}';R()">${t}</button>`).join("")}</div>`+({ov:vOv,vl:vVl,yr:vYr,si:vSi,sl:vSl,by:vBy,st:vSt})[tab]()+VF}

const kv=a=>`<div class="g" style="margin-top:8px">${a.map(([k,x,c])=>`<div><div class="k">${k}</div><div class="v ${c||""}">${x}</div></div>`).join("")}</div>`;
const pct=x=>x==null||isNaN(x)?"–":(x*100).toLocaleString("de-DE",{maximumFractionDigits:1})+" %";
const rg=a=>{const c=sm(a,"cost");return c>0?sm(a,"gross")/c:null},rn=a=>{const c=sm(a,"cost");return c>0?sm(a,"after")/c:null};
const pa=a=>{a=a.filter(r=>r.hold>=30&&r.cost>0);const d=a.reduce((x,r)=>x+r.cost*r.hold/365.25,0);return d>0?sm(a,"gross")/d:null};
const own=()=>{const{lots}=C();return Object.keys(lots).filter(n=>sm(lots[n],"q")>1e-9).sort()};
const hq=n=>{const L=C().lots[n]||[],q=sm(L,"q");return{q,c:q>1e-9?L.reduce((x,l)=>x+l.q*l.c,0)/q:0}};
const stats=r=>kv([["Brutto",f(r.gross),cl(r.gross)],["Netto",f(r.after),cl(r.after)],["Steuer",f(r.tax)],["Haltedauer",H(r.hold)],["Rendite brutto",pct(rg([r]))],["Rendite netto",pct(rn([r]))],["Rendite p. a.",pct(pa([r]))]]);
const bars=(rows,leg)=>{const m=Math.max(1,...rows.flatMap(r=>r[1].map(x=>Math.abs(x))));return`<div class="c">${rows.map(([l,vs])=>`<div class="k" style="margin-top:6px">${esc(l)}</div>${vs.map((x,i)=>`<div style="display:flex;align-items:center;gap:6px"><div style="height:10px;border-radius:3px;background:${x>=0?"var(--ok)":"var(--bad)"};opacity:${vs.length>1&&!i?.45:1};width:${Math.max(1,Math.abs(x)/m*70)}%"></div><span class="k">${f(x)}</span></div>`).join("")}`).join("")}<div class="k" style="margin-top:8px">${leg}</div></div>`};
function lc(ss,t0,t1){const all=ss.flatMap(s=>s.p.map(p=>p[1])).concat(0),mn=Math.min(...all),mx=Math.max(...all),X=t=>t1>t0?56+(t-t0)/(t1-t0)*276:194,Y=y=>mx>mn?130-(y-mn)/(mx-mn)*120:70,e=n=>Math.round(n).toLocaleString("de-DE")+" €",dd=t=>D(new Date(t).toISOString().slice(0,10)),tx=(x,a,t)=>`<text x="${x}" y="152" text-anchor="${a}" font-size="10" fill="var(--mu)">${t}</text>`;
 return`<svg viewBox="0 0 340 158" width="100%" role="img" aria-label="Verlauf">${[...new Set([mx,0,mn])].map(y=>`<line x1="56" x2="332" y1="${Y(y)}" y2="${Y(y)}" stroke="var(--ln)" ${y?"":'stroke-dasharray="4 3"'}/><text x="52" y="${Y(y)+3}" text-anchor="end" font-size="10" fill="var(--mu)">${e(y)}</text>`).join("")}${tx(56,"start",dd(t0))}${t1>t0?tx(194,"middle",dd(t0+(t1-t0)/2))+tx(332,"end",dd(t1)):""}${ss.map(s=>`<polyline points="${s.p.map(p=>X(p[0]).toFixed(1)+","+Y(p[1]).toFixed(1)).join(" ")}" fill="none" stroke="${s.c}" stroke-width="2"/>`).join("")}</svg><div class="k">${ss.map(s=>`<span style="color:${s.c}">▬</span> ${s.n} ${f(s.p[s.p.length-1][1])}`).join(" &nbsp; ")}</div>`}

function vOv(){const{res,lots}=C();
 if(!res.length&&!S.buys.length)return`<div class="c">Noch keine Einträge. Erfasse zuerst einen Kauf, danach den Verkauf.</div>`;
 const names=[...new Set(S.buys.map(b=>b.stock).concat(res.map(r=>r.stock)))].sort(),bound=n=>(lots[n]||[]).reduce((x,l)=>x+l.q*l.c,0),inv=n=>sm(S.buys.filter(b=>b.stock==n),"total"),tt=sm(S.buys,"total"),tb=names.reduce((x,n)=>x+bound(n),0);
 return`<div class="c">${kv([["Investiert gesamt",f(tt)],["Aktuell gebunden",f(tb)],["Brutto-Gewinn",f(sm(res,"gross")),cl(sm(res,"gross"))],["Gebühren (Verkauf)",f(sm(res,"fee"))],["Steuern",f(sm(res,"tax"))],["Netto",f(sm(res,"after")),cl(sm(res,"after"))],["Rendite brutto",pct(rg(res))],["Rendite p. a.",pct(pa(res))]])}</div><h2>Je Aktie</h2><div class="c w"><table><tr><th>Aktie</th><th>Seit</th><th>Investiert</th><th>Gebunden</th><th>Brutto real.</th><th>Netto real.</th><th>Rendite</th></tr>${names.map(n=>{const a=res.filter(r=>r.stock==n),first=S.buys.filter(b=>b.stock==n).map(b=>b.date).sort()[0];return`<tr><td>${esc(n)}</td><td>${first?D(first):"–"}</td><td>${f(inv(n))}</td><td>${f(bound(n))}</td><td class="${cl(sm(a,"gross"))}">${a.length?f(sm(a,"gross")):"–"}</td><td>${a.length?f(sm(a,"after")):"–"}</td><td>${pct(rg(a))}</td></tr>`}).join("")}<tr><td><b>Summe</b></td><td></td><td>${f(tt)}</td><td>${f(tb)}</td><td>${f(sm(res,"gross"))}</td><td>${f(sm(res,"after"))}</td><td>${pct(rg(res))}</td></tr></table></div><p class="mu">Rendite = Gewinn ÷ Einstandskosten der verkauften Stück. „p. a.“ rechnet auf ein Jahr hoch und berücksichtigt nur Verkäufe mit mindestens 30 Tagen Haltedauer.</p>`}

let vy="all";
function vVl(){const{res}=C();if(!res.length&&!S.buys.length)return`<div class="c">Noch keine Daten.</div>`;
 const pts=[...S.buys.map(b=>({d:b.date,k:b.total,g:0,n:0})),...res.map(r=>({d:r.date,k:-r.cost,g:r.gross,n:r.after}))].sort((a,b)=>a.d.localeCompare(b.d)),ys=[...new Set(pts.map(p=>p.d.slice(0,4)))].sort();
 if(vy!="all"&&!ys.includes(vy))vy="all";
 let k=0,g=0,n=0;const A=pts.map(p=>({y:p.d.slice(0,4),t:Date.parse(p.d),k:k+=p.k,g:g+=p.g,n:n+=p.n}));
 let L=A,z={k:0,g:0,n:0};
 if(vy!="all"){const pre=A.filter(a=>a.y<vy);if(pre.length)z=pre[pre.length-1];L=[{t:Date.parse(vy+"-01-01"),k:z.k,g:z.g,n:z.n},...A.filter(a=>a.y==vy)]}
 const s=(key,nm,c,o)=>({n:nm,c,p:L.map(a=>[a.t,a[key]-(o?z[key]:0)])}),dy=[...new Set(res.map(r=>r.date.slice(0,4)))].sort();
 return`<div class="c"><label>Zeitraum</label><select onchange="vy=this.value;R()">${["all",...ys].map(y=>`<option value="${y}"${y==vy?" selected":""}>${y=="all"?"Gesamte Laufzeit":y}</option>`).join("")}</select>${lc([s("k","Gebunden","var(--mu)",0),s("g","Brutto","var(--ac)",1),s("n","Netto","var(--ok)",1)],L[0].t,L[L.length-1].t)}</div>`
 +(dy.length?`<h2>Gewinn je Jahr</h2>`+bars(dy.map(y=>{const a=res.filter(r=>r.date.slice(0,4)==y);return[y,[sm(a,"gross"),sm(a,"after")]]}),"Hell: brutto, kräftig: netto nach Steuern"):"")
 +(res.length?`<h2>Gewinn je Aktie</h2>`+bars([...new Set(res.map(r=>r.stock))].sort().map(n=>[n,[sm(res.filter(r=>r.stock==n),"gross")]]),"Brutto realisiert"):"")}

function vYr(){const{res,Y}=C(),ys=Object.keys(Y).sort().reverse();
 return(ys.length?ys.map(y=>{const a=res.filter(r=>r.date.slice(0,4)==y),q=Y[y];return`<div class="c"><h2 style="margin:0">${y}</h2>${kv([["Brutto",f(sm(a,"gross")),cl(sm(a,"gross"))],["Gebühren",f(sm(a,"fee"))],["Steuer",f(sm(a,"tax"))],["Netto",f(sm(a,"after")),cl(sm(a,"after"))],["Verkäufe",a.length],["Freibetrag genutzt",f(q.used)+" von "+f(q.al)],["Verlustvortrag ins Folgejahr",f(q.carry)],["Rendite brutto",pct(rg(a))],["Rendite netto",pct(rn(a))],["Rendite p. a.",pct(pa(a))]])}</div>`}).join(""):`<div class="c mu">Noch keine Verkäufe.</div>`)+`<p class="mu">Jahreswerte werden immer live aus deinen Verkäufen berechnet.</p>`}

const sel=()=>($("#sn")||{}).value||"";
const sfm=()=>{const o=own();return`${o.length?`<label>Aktie</label><select id="sn">${o.map(n=>{const h=hq(n);return`<option value="${esc(n)}">${esc(n)} (Bestand ${nf(+h.q.toFixed(4))}, Ø ${f(h.c)})</option>`}).join("")}</select>`:`<p class="mu">Kein Bestand. Erfasse zuerst einen Kauf.</p>`}<label>Datum</label><input id="sd" type="date" value="${today()}"><div class="g"><div><label>Stück</label><input id="sq" inputmode="decimal"></div><div><label>Kurs (€)</label><input id="sp" inputmode="decimal"></div><div><label>Gebühr (€)</label><input id="sf" inputmode="decimal"></div></div><button class="s" onclick="all_()">Alle Stück</button>`};
const all_=()=>{const n=sel();if(n)$("#sq").value=nf(+hq(n).q.toFixed(4))};
const rd=()=>({id:uid(),stock:sel(),date:v("sd"),qty:num(v("sq")),price:num(v("sp")),fee:num(v("sf"))||0}),ok=x=>x.stock&&x.date&&x.qty>0&&!isNaN(x.price);
function vSl(){const{res}=C();
 return`<div class="c"><h2 style="margin-top:0">Verkauf erfassen</h2>${sfm()}<label style="display:block">Steuer abweichend (optional, leer = berechnet)</label><input id="sx" inputmode="decimal"><button onclick="addSl()">Verkauf speichern</button><div id="m" class="n"></div></div>`
 +(res.length?[...res].reverse().map(r=>`<div class="c"><b>${esc(r.stock)}</b> <span class="mu">${D(r.date)}, ${nf(r.qty)} Stk. zu ${f(r.price)}</span>${r.over?`<div class="n">Mehr verkauft als im Bestand. Prüfe die Käufe.</div>`:""}${stats(r)}<label style="display:block;margin-top:8px">Steuer überschreiben (berechnet: ${f(r.tc)})</label><input inputmode="decimal" value="${r.tx==null?"":nf(r.tx)}" onchange="ov('${r.id}',this.value)"><button class="s" onclick="del('sells','${r.id}',this)">Löschen</button></div>`).join(""):`<div class="c mu">Noch kein Verkauf erfasst.</div>`)}
function addSl(){const x={...rd(),tx:v("sx").trim()===""?null:num(v("sx"))};
 if(!ok(x))return msg("Bitte Aktie, Datum, Stückzahl und Kurs ausfüllen.");
 S.sells.push(x);if(C().res.find(r=>r.id==x.id).over){S.sells.pop();return msg("Das sind mehr Stück, als zu diesem Datum im Bestand sind. Erfasse zuerst die Käufe.")}
 save();R()}
function ov(id,x){const s=S.sells.find(s=>s.id==id);x=String(x).trim();s.tx=x===""||isNaN(num(x))?null:num(x);save();R()}
function del(t,id,b){if(!b.dataset.c){b.dataset.c=1;b.textContent="Wirklich löschen?";return}S[t]=S[t].filter(x=>x.id!=id);save();R()}
function simr(x){S.sells.push({...x,tx:null});const r=C().res.find(r=>r.id==x.id);S.sells.pop();return r}
function vSi(){
 return`<div class="c"><h2 style="margin-top:0">Verkauf simulieren</h2>${sfm()}<button onclick="addSi()">Simulation speichern</button><div id="m" class="n"></div><p class="mu">Simulationen beeinflussen deine echten Zahlen nicht. Jede wird einzeln gegen deinen aktuellen Stand gerechnet.</p></div>`
 +(S.sim.length?S.sim.map(x=>{const r=simr(x);return`<div class="c"><b>${esc(x.stock)}</b> <span class="mu">${D(x.date)}, ${nf(x.qty)} Stk. zu ${f(x.price)}</span>${r.over?`<div class="n">Mehr als im Bestand.</div>`:""}${stats(r)}<button onclick="adopt('${x.id}')">Als Verkauf übernehmen</button> <button class="s" onclick="del('sim','${x.id}',this)">Löschen</button></div>`}).join(""):`<div class="c mu">Noch keine Simulation gespeichert.</div>`)}
function addSi(){const x=rd();if(!ok(x))return msg("Bitte Aktie, Datum, Stückzahl und Kurs ausfüllen.");S.sim.push(x);save();R()}
function adopt(id){const x=S.sim.find(s=>s.id==id);S.sells.push({...x,tx:null});if(C().res.find(r=>r.id==id).over){S.sells.pop();return msg("Mehr Stück als im Bestand.")}S.sim=S.sim.filter(s=>s.id!=id);save();R()}

function vBy(){const n=[...new Set(S.buys.map(b=>b.stock))].sort();

 +(S.buys.length?[...S.buys].sort((a,b)=>b.date.localeCompare(a.date)).map(b=>`<div class="c"><b>${esc(b.stock)}</b> <span class="mu">${D(b.date)}, ${nf(b.qty)} Stk.</span>${kv([["Gesamtkosten",f(b.total)],["Pro Stück inkl. Gebühr",f(b.total/b.qty)]])}<button class="s" onclick="del('buys','${b.id}',this)">Löschen</button></div>`).join(""):`<div class="c mu">Noch kein Kauf erfasst.</div>`)}

 <div class="c"><h2 style="margin-top:0">Sicherheit</h2><label>Neuer Code (mindestens 6 Zeichen)</label><input id="nc" type="password"><button onclick="chg()">Code ändern</button> <button class="s" onclick="lock()">Jetzt sperren</button><div id="m" class="n"></div></div>

async function ex(){$("#ex").value=await seal(key,salt,S)}

R();
